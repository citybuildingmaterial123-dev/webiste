# Rebuilds the live site every day so Google Sheet edits go live even if nobody
# presses "Website > Publish changes" in the sheet. It calls a Cloudflare Pages
# deploy hook; Cloudflare then fetches the sheet and rebuilds.
#
# Setup: Cloudflare dashboard > Workers & Pages > your project > Settings >
# Builds > Deploy hooks > Add (branch: main). Copy the URL into this repository:
# GitHub > Settings > Secrets and variables > Actions > New repository secret
#   Name: CLOUDFLARE_DEPLOY_HOOK_URL
#
# Run it by hand any time: Actions > Refresh catalogue > Run workflow.
name: Refresh catalogue

on:
  schedule:
    - cron: "30 21 * * *" # every day at 03:00 India time (21:30 UTC)
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK_URL secret is not set; nothing to do. See the comments in this workflow."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK"
          echo "Rebuild requested. Watch it in the Cloudflare Pages dashboard."
