# Keeps the live site in step with the Google Sheet.
#
# Every hour this reads the product sheet. If its contents changed since the
# last check, it commits the new fingerprint to data/catalog-version.txt. That
# push makes Cloudflare rebuild the site, and the build reads the sheet again.
# Nothing is rebuilt when the sheet has not changed.
#
# Setup (once): GitHub > Settings > Secrets and variables > Actions
#   Variables tab:  GOOGLE_SHEET_ID, GOOGLE_SHEET_GID   (or GOOGLE_SHEET_CSV_URL)
#                   GOOGLE_SHEET_TAB                    (only for the API key / service account options)
#   Secrets tab:    GOOGLE_SHEETS_API_KEY or GOOGLE_SERVICE_ACCOUNT_EMAIL + _PRIVATE_KEY (only if you use them)
# Use the same values as in the Cloudflare build variables.
#
# Publish right now: Actions > Refresh catalogue > Run workflow (tick "force" to
# rebuild even if the sheet is unchanged, e.g. after replacing a photo on Drive).
name: Refresh catalogue

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the sheet has not changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-catalogue
  cancel-in-progress: false

jobs:
  check-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Read the Google Sheet
        id: sheet
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_GID: ${{ vars.GOOGLE_SHEET_GID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          GOOGLE_SHEET_CSV_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$GOOGLE_SHEET_ID$GOOGLE_SHEET_CSV_URL" ]; then
            echo "::notice::No sheet configured yet (repository variable GOOGLE_SHEET_ID). Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # lib/googleSheets.ts has no npm dependencies, so tsx alone is enough (no npm ci).
          new="$(npx -y tsx@4 scripts/sheet-fingerprint.ts)"
          old="$(tr -d '[:space:]' < data/catalog-version.txt 2>/dev/null || true)"
          if [ "$new" != "$old" ]; then
            echo "$new" > data/catalog-version.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sheet changed: $old -> $new"
          elif [ "$FORCE" = "true" ]; then
            echo "changed=force" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sheet unchanged."
          fi

      - name: Commit, which triggers the Cloudflare rebuild
        if: steps.sheet.outputs.changed != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-version.txt
          git commit --allow-empty -m "Catalogue update from Google Sheets"
          git push
